    <g fill="#F7F7F4" stroke="#6E405F" stroke-width="2"><circle cx="57" cy="100" r="9"/><circle cx="57" cy="136" r="9"/><circle cx="57" cy="172" r="9"/><circle cx="57" cy="208" r="9"/><circle cx="57" cy="244" r="9"/></g>
    <g fill="#6E405F"><circle cx="57" cy="100" r="3.5"/><circle cx="57" cy="136" r="3.5"/><circle cx="57" cy="172" r="3.5"/><circle cx="57" cy="208" r="3.5"/><circle cx="57" cy="244" r="3.5"/></g>
    <g fill="#171610" font-size="12" font-weight="700"><text x="81" y="104">Проект</text><text x="81" y="140">Проверка</text><text x="81" y="176">Согласование</text><text x="81" y="212">Обсуждение</text><text x="81" y="248">Доработка</text></g>
    <path d="M57 255C57 276 333 276 333 100C333 82 57 82 57 90" fill="none" stroke="#6E405F" stroke-width="3.5" marker-end="url(#a)"/>
