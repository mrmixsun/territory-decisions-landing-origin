<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Последствия разрыва цифрового жизненного цикла</title><desc id="desc">Повторный сбор, ручная сверка, риск расхождений и поздние переделки возникают из одного разрыва.</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E5E1DA"/></pattern></defs>
  <rect width="760" height="460" rx="18" fill="#F2F1ED"/><rect width="760" height="460" rx="18" fill="url(#grid)"/>
  <g font-family="Arial,Helvetica,sans-serif"><text x="36" y="38" fill="#6E405F" font-size="12" font-weight="700" letter-spacing="1.5">ОДИН РАЗРЫВ — ЧЕТЫРЕ ГРУППЫ ПОСЛЕДСТВИЙ</text>
    <g fill="#F7F7F4" stroke="#D9D5CF"><rect x="36" y="66" width="320" height="126" rx="12"/><rect x="404" y="66" width="320" height="126" rx="12"/><rect x="36" y="218" width="320" height="126" rx="12"/><rect x="404" y="218" width="320" height="126" rx="12"/></g>
    <g fill="#EAE3E8"><circle cx="68" cy="98" r="16"/><circle cx="436" cy="98" r="16"/><circle cx="68" cy="250" r="16"/><circle cx="436" cy="250" r="16"/></g>
    <g fill="#6E405F" font-size="12" font-weight="700" text-anchor="middle"><text x="68" y="102">01</text><text x="436" y="102">02</text><text x="68" y="254">03</text><text x="436" y="254">04</text></g>
    <g fill="#171610" font-size="16" font-weight="700"><text x="96" y="94">Повторный сбор</text><text x="96" y="115">исходных сведений</text><text x="464" y="94">Ручная сверка</text><text x="464" y="115">документов и данных</text><text x="96" y="246">Риск расхождения</text><text x="96" y="267">акта и рабочей версии</text><text x="464" y="246">Поздние конфликты</text><text x="464" y="267">и переделки</text></g>
    <g fill="#74706A" font-size="12"><text x="58" y="145">Участники снова запрашивают то,</text><text x="58" y="162">что уже собиралось для решения.</text><text x="426" y="145">Связи и версии приходится</text><text x="426" y="162">восстанавливать вручную.</text><text x="58" y="297">Нельзя быстро подтвердить,</text><text x="58" y="314">какое содержание утверждено.</text><text x="426" y="297">Проблема обнаруживается, когда</text><text x="426" y="314">изменения уже стоят дорого.</text></g>
    <rect x="36" y="370" width="688" height="54" rx="12" fill="#171610"/><circle cx="65" cy="397" r="9" fill="#F54E00"/><text x="86" y="402" fill="#F7F7F4" font-size="14" font-weight="700">Причина общая: содержание решения живёт в несвязанных представлениях.</text>
  </g>
</svg>
